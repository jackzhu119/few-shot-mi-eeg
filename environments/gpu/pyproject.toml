[project]
name = "paper2-gpu-environment"
version = "0.1.0"
description = "Reproducible offline EEG infrastructure for learning-preserving co-adaptive BCI research"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "mne==1.10.2",
    "boto3==1.43.111",
]

[project.optional-dependencies]
data = ["moabb==1.4.3"]
deep = ["torch==2.8.0", "torchaudio==2.8.0", "braindecode==1.2.0"]
dev = ["pytest>=8.3.5,<9", "ruff>=0.12,<1"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.uv]
package = false
