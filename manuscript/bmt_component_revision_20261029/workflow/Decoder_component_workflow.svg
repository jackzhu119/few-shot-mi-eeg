    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="11.338583" y="322.979015" transform="rotate(-0 11.338583 322.979015)">Frozen uses zero target labels; the three updates share source/support identities.</text>
   </g>
   <g id="text_27">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="11.338583" y="333.750668" transform="rotate(-0 11.338583 333.750668)">Query is used for inference, not reference estimation, parameter fitting or selection.</text>
   </g>
   <g id="text_28">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="11.338583" y="344.522322" transform="rotate(-0 11.338583 344.522322)">Dataset-specific preprocessing and covariance estimators are defined in Methods.</text>
   </g>
  </g>
 </g>
